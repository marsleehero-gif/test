<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>你的好色指数测试 💕</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
    background: #0a0a1a;
    color: #fff;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .bg-particles {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  .particle {
    position: absolute;
    width: 4px; height: 4px;
    background: rgba(255, 100, 150, 0.6);
    border-radius: 50%;
    animation: float linear infinite;
  }

  @keyframes float {
    0% { transform: translateY(100vh) scale(0); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(-10vh) scale(1); opacity: 0; }
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 680px;
    margin: 0 auto;
    padding: 20px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .screen {
    display: none;
    flex-direction: column;
    align-items: center;
    text-align: center;
    animation: fadeIn 0.6s ease;
  }

  .screen.active { display: flex; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .main-title {
    font-size: 2.2rem;
    font-weight: 700;
    background: linear-gradient(135deg, #ff6b9d, #c44569, #ff9a9e);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 16px;
    line-height: 1.3;
  }

  .subtitle {
    font-size: 1rem;
    color: #aaa;
    margin-bottom: 40px;
    line-height: 1.8;
    max-width: 500px;
  }

  .hearts-decoration {
    font-size: 2rem;
    margin-bottom: 30px;
    animation: pulse 2s ease infinite;
    letter-spacing: 8px;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }

  .btn {
    padding: 16px 48px;
    font-size: 1.1rem;
    font-weight: 600;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.3s ease;
    font-family: inherit;
    letter-spacing: 1px;
    user-select: none;
  }

  .btn-primary {
    background: linear-gradient(135deg, #ff6b9d, #c44569);
    color: #fff;
    box-shadow: 0 8px 30px rgba(255, 107, 157, 0.4);
  }

  .btn-primary:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 40px rgba(255, 107, 157, 0.6);
  }

  /* Progress */
  .progress-wrap {
    width: 100%;
    margin-bottom: 40px;
  }

  .progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 0.85rem;
    color: #888;
    margin-bottom: 8px;
  }

  .progress-bar {
    width: 100%;
    height: 6px;
    background: rgba(255,255,255,0.1);
    border-radius: 3px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #ff6b9d, #ff9a9e);
    border-radius: 3px;
    transition: width 0.5s ease;
  }

  /* Question */
  .question-number {
    font-size: 0.9rem;
    color: #ff6b9d;
    margin-bottom: 12px;
    font-weight: 500;
  }

  .question-text {
    font-size: 1.25rem;
    font-weight: 500;
    margin-bottom: 36px;
    line-height: 1.6;
    color: #fff;
  }

  .options {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .option {
    padding: 16px 24px;
    background: rgba(255,255,255,0.05);
    border: 2px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    cursor: pointer;
    transition: all 0.3s ease;
    text-align: left;
    font-size: 1rem;
    color: #ddd;
    font-family: inherit;
    display: flex;
    align-items: center;
    gap: 14px;
    user-select: none;
    opacity: 1 !important;
  }

  .option:hover {
    border-color: rgba(255, 107, 157, 0.6);
    background: rgba(255, 107, 157, 0.1);
    transform: translateX(6px);
  }

  .option.selected {
    border-color: #ff6b9d;
    background: rgba(255, 107, 157, 0.2);
    color: #fff;
    box-shadow: 0 0 20px rgba(255, 107, 157, 0.2);
  }

  .option-letter {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 0.85rem;
    flex-shrink: 0;
    transition: all 0.3s;
  }

  .option.selected .option-letter {
    background: linear-gradient(135deg, #ff6b9d, #c44569);
    color: #fff;
  }

  /* Result */
  .result-card {
    width: 100%;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 24px;
    padding: 40px 30px;
    margin-top: 20px;
  }

  .result-type {
    font-size: 1rem;
    color: #ff6b9d;
    font-weight: 500;
    margin-bottom: 10px;
    letter-spacing: 2px;
  }

  .result-name {
    font-size: 2rem;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .result-emoji { font-size: 3rem; margin-bottom: 20px; }

  .result-score {
    font-size: 4rem;
    font-weight: 700;
    background: linear-gradient(135deg, #ff6b9d, #ffd700, #ff9a9e);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 6px;
  }

  .result-score-label {
    font-size: 0.9rem;
    color: #888;
    margin-bottom: 30px;
  }

  .result-desc {
    font-size: 1rem;
    color: #bbb;
    line-height: 1.8;
    margin-bottom: 30px;
    text-align: left;
  }

  .result-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 30px;
    justify-content: center;
  }

  .tag {
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 0.8rem;
    background: rgba(255, 107, 157, 0.15);
    border: 1px solid rgba(255, 107, 157, 0.3);
    color: #ff9a9e;
  }

  /* Animations */
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .slide-up {
    animation: slideUp 0.5s ease forwards;
  }

  .delay-1 { animation-delay: 0.1s; }
  .delay-2 { animation-delay: 0.2s; }
  .delay-3 { animation-delay: 0.3s; }
  .delay-4 { animation-delay: 0.4s; }

  /* Mobile */
  @media (max-width: 480px) {
    .main-title { font-size: 1.7rem; }
    .question-text { font-size: 1.1rem; }
    .result-name { font-size: 1.6rem; }
    .result-score { font-size: 3rem; }
  }
</style>
</head>
<body>

<div class="bg-particles" id="particles"></div>

<div class="container">

  <!-- 开场页 -->
  <div class="screen active" id="screen-start">
    <div class="hearts-decoration">💘 💖 💝 💕</div>
    <h1 class="main-title">
      <span style="font-size:3rem;-webkit-text-fill-color:initial;display:block;margin-bottom:8px;">🔍</span>
      你的好色指数<br>有多高？
    </h1>
    <p class="subtitle">
      通过 8 道趣味心理题<br>
      测出你在感情中的真实风格<br>
      答案绝对保密，仅供娱乐 🎭
    </p>
    <button class="btn btn-primary" id="btn-start">开始测试 →</button>
  </div>

  <!-- 问题页 -->
  <div class="screen" id="screen-question">
    <div class="progress-wrap">
      <div class="progress-info">
        <span id="qNum">第 1 题</span>
        <span id="qProgress">1 / 8</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill" style="width:12.5%"></div>
      </div>
    </div>

    <p class="question-number" id="questionNum"></p>
    <p class="question-text" id="questionText"></p>

    <div class="options" id="optionsContainer"></div>
  </div>

  <!-- 结果页 -->
  <div class="screen" id="screen-result">
    <div class="result-card">
      <p class="result-type">你的类型是</p>
      <h2 class="result-name" id="resultName"></h2>
      <div class="result-emoji" id="resultEmoji"></div>
      <div class="result-score" id="resultScore"></div>
      <p class="result-score-label">好色指数 · 仅供娱乐</p>
      <div class="result-tags" id="resultTags"></div>
      <p class="result-desc" id="resultDesc"></p>
      <div>
        <button class="btn btn-primary" id="btn-restart">再测一次 🔄</button>
      </div>
    </div>
  </div>

</div>

<script>
(function() {
  "use strict";

  const questions = [
    {
      text: "走在街上看到一个很帅/很漂亮的人，你会？",
      options: [
        { label: "忍不住多看几眼，内心小鹿乱撞", score: 4 },
        { label: "偷偷看一眼，然后装作若无其事", score: 3 },
        { label: "正常路过，瞟一眼就过去了", score: 2 },
        { label: "根本没注意，低头看手机", score: 0 }
      ]
    },
    {
      text: "看一部浪漫电影，你最容易代入哪种角色？",
      options: [
        { label: "疯狂追求对方的主角", score: 4 },
        { label: "暗恋对方但不敢表达的配角", score: 3 },
        { label: "理性分析的旁观者", score: 1 },
        { label: "完全无法代入，只看特效", score: 0 }
      ]
    },
    {
      text: "你的微信好友里，有多少人让你觉得「有点心动」？",
      options: [
        { label: "5个以上 😳", score: 4 },
        { label: "2~4个", score: 3 },
        { label: "1个左右", score: 1 },
        { label: "0个", score: 0 }
      ]
    },
    {
      text: "深夜睡不着时，你通常在想什么？",
      options: [
        { label: "crush 对象，脑补各种画面", score: 4 },
        { label: "回想今天的社交场景", score: 3 },
        { label: "工作/学习的事", score: 1 },
        { label: "啥也没想，直接睡着了 😴", score: 0 }
      ]
    },
    {
      text: "朋友聚会时，有人开玩笑说「你今天是不是来艳遇的」？",
      options: [
        { label: "嘴上否认，心里暗暗期待", score: 4 },
        { label: "大方承认，反正开玩笑嘛", score: 3 },
        { label: "翻个白眼说「你想什么呢」", score: 1 },
        { label: "完全听不懂这个梗", score: 0 }
      ]
    },
    {
      text: "对方发来一条有点暧昧的消息，你会？",
      options: [
        { label: "反复研究每个字，分析到底什么意思", score: 4 },
        { label: "开心一下，然后淡定回复", score: 3 },
        { label: "正常回复，不多想", score: 1 },
        { label: "假装没看到，过会再回 😅", score: 0 }
      ]
    },
    {
      text: "你觉得自己是个容易「上头」的人吗？",
      options: [
        { label: "经常上头，停不下来那种", score: 4 },
        { label: "偶尔会上头，但能控制", score: 3 },
        { label: "很少上头，我很理性", score: 1 },
        { label: "完全不会，冷静得像冰块 🧊", score: 0 }
      ]
    },
    {
      text: "如果给你一个重新来过的机会，你会对曾经暗恋的人说什么？",
      options: [
        { label: "大胆表白，不留遗憾！", score: 4 },
        { label: "委婉暗示，看看对方意思", score: 3 },
        { label: "什么都不说，珍惜当下就好", score: 1 },
        { label: "算了，已经过去了 🙃", score: 0 }
      ]
    }
  ];

  const types = [
    {
      min: 0, max: 10,
      name: "清心寡欲型 💤",
      emoji: "🧊",
      tags: ["高冷", "理性", "绝缘体"],
      desc: "好色指数几乎为零！你对感情的事相当淡定，不会被外表轻易打动。在别人眼里你可能是「绝缘体」，但其实你只是还没遇到那个对的人。对你来说，感情不是必需品，宁缺毋滥是你的信条。"
    },
    {
      min: 11, max: 17,
      name: "佛系心动型 🧘",
      emoji: "🍃",
      tags: ["淡定", "随缘", "偶尔上头"],
      desc: "你的好色程度属于正常范围，偶尔会被特别的人或瞬间打动，但很快就能恢复冷静。你不是不会心动，只是不会轻易上头。喜欢「顺其自然」，遇到喜欢的也会克制，属于闷骚型选手～"
    },
    {
      min: 18, max: 24,
      name: "闷骚暗涌型 🌶️",
      emoji: "🔥",
      tags: ["表面淡定", "内心火热", "间歇性上头"],
      desc: "你属于外冷内热型！表面上看起来波澜不惊，实际上内心戏超多。看到心动的人会偷偷在意，但不会主动表达。属于那种嘴上说「随便啦」，心里却在意得不行的人。容易间歇性上头，然后快速冷静。"
    },
    {
      min: 25, max: 32,
      name: "热情奔放型 💃",
      emoji: "💃",
      tags: ["敢爱敢恨", "社交达人", "高调追爱"],
      desc: "你的好色程度相当高！遇到喜欢的人，你会大方欣赏，毫不掩饰自己的好感。你相信「喜欢就要说出来」，是朋友圈里的「恋爱军师」。你的热情和真诚能感染周围的人，但也容易因为太直接而吓到对方哦～"
    }
  ];

  let currentQ = 0;
  let totalScore = 0;
  let answered = false;

  // 创建浮动粒子
  function createParticles() {
    var container = document.getElementById("particles");
    if (!container) return;
    var colors = ["rgba(255,107,157,0.6)", "rgba(255,154,158,0.5)", "rgba(196,69,105,0.4)", "rgba(255,215,0,0.3)"];
    for (var i = 0; i < 25; i++) {
      var p = document.createElement("div");
      p.className = "particle";
      p.style.left = Math.random() * 100 + "%";
      var size = Math.random() * 4 + 2 + "px";
      p.style.width = size;
      p.style.height = size;
      p.style.background = colors[Math.floor(Math.random() * colors.length)];
      p.style.animationDuration = (Math.random() * 10 + 8) + "s";
      p.style.animationDelay = (Math.random() * 10) + "s";
      container.appendChild(p);
    }
  }

  function showScreen(id) {
    var screens = document.querySelectorAll(".screen");
    for (var i = 0; i < screens.length; i++) {
      screens[i].classList.remove("active");
    }
    var target = document.getElementById(id);
    if (target) target.classList.add("active");
  }

  function startTest() {
    currentQ = 0;
    totalScore = 0;
    answered = false;
    showScreen("screen-question");
    renderQuestion();
  }

  function renderQuestion() {
    var q = questions[currentQ];
    var qNum = document.getElementById("qNum");
    var qProgress = document.getElementById("qProgress");
    var progressFill = document.getElementById("progressFill");
    var questionText = document.getElementById("questionText");
    var container = document.getElementById("optionsContainer");

    if (!qNum || !qProgress || !progressFill || !questionText || !container) return;

    qNum.textContent = "第 " + (currentQ + 1) + " 题";
    qProgress.textContent = (currentQ + 1) + " / " + questions.length;
    progressFill.style.width = ((currentQ + 1) / questions.length * 100) + "%";
    questionText.textContent = q.text;

    var letters = ["A", "B", "C", "D"];
    container.innerHTML = "";
    answered = false;

    for (var i = 0; i < q.options.length; i++) {
      var opt = q.options[i];
      var btn = document.createElement("button");
      btn.className = "option slide-up delay-" + (i + 1);
      btn.setAttribute("data-score", opt.score);
      btn.innerHTML = '<span class="option-letter">' + letters[i] + '</span><span>' + opt.label + '</span>';
      btn.addEventListener("click", (function(b, s) {
        return function() { selectOption(b, s); };
      })(btn, opt.score));
      container.appendChild(btn);
    }
  }

  function selectOption(el, score) {
    if (answered) return;
    answered = true;

    var options = document.querySelectorAll(".option");
    for (var i = 0; i < options.length; i++) {
      options[i].classList.remove("selected");
    }
    el.classList.add("selected");

    totalScore += score;

    setTimeout(function() {
      currentQ++;
      if (currentQ < questions.length) {
        renderQuestion();
        window.scrollTo({ top: 0, behavior: "smooth" });
      } else {
        showResult();
      }
    }, 400);
  }

  function showResult() {
    var type = null;
    for (var i = 0; i < types.length; i++) {
      if (totalScore >= types[i].min && totalScore <= types[i].max) {
        type = types[i];
        break;
      }
    }
    if (!type) type = types[types.length - 1];

    var resultName = document.getElementById("resultName");
    var resultEmoji = document.getElementById("resultEmoji");
    var resultScore = document.getElementById("resultScore");
    var resultDesc = document.getElementById("resultDesc");
    var tagsContainer = document.getElementById("resultTags");

    if (resultName) resultName.textContent = type.name;
    if (resultEmoji) resultEmoji.textContent = type.emoji;
    if (resultScore) resultScore.textContent = totalScore + " 分";
    if (resultDesc) resultDesc.textContent = type.desc;

    if (tagsContainer) {
      tagsContainer.innerHTML = "";
      for (var j = 0; j < type.tags.length; j++) {
        var span = document.createElement("span");
        span.className = "tag";
        span.textContent = type.tags[j];
        tagsContainer.appendChild(span);
      }
    }

    showScreen("screen-result");
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function restart() {
    window.scrollTo({ top: 0, behavior: "smooth" });
    setTimeout(function() {
      showScreen("screen-start");
    }, 300);
  }

  // 绑定按钮事件（不用 onclick 属性，避免全局函数问题）
  function bindEvents() {
    var btnStart = document.getElementById("btn-start");
    var btnRestart = document.getElementById("btn-restart");
    if (btnStart) btnStart.addEventListener("click", startTest);
    if (btnRestart) btnRestart.addEventListener("click", restart);
  }

  // 初始化
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", function() {
      createParticles();
      bindEvents();
    });
  } else {
    createParticles();
    bindEvents();
  }

})();
</script>
</body>
</html>
